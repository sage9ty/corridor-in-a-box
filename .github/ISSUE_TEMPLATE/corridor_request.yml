name: New corridor
description: Propose a new corridor manifest (a *.corridor.yaml lane).
labels: ["corridor"]
body:
  - type: markdown
    attributes:
      value: |
        A corridor is **configuration, not code**. A new lane is a new
        `*.corridor.yaml`, never a change to `packages/engine`. If your lane needs
        engine behaviour that doesn't exist yet, open a regular issue instead.
  - type: input
    id: lane
    attributes:
      label: Lane
      description: Source → destination, with the receiving anchor.
      placeholder: "MX → AR via Bitso / Anclap"
    validations:
      required: true
  - type: dropdown
    id: liveness
    attributes:
      label: What does `pnpm cli plan` report?
      description: Run `pnpm cli plan corridors/your-lane.corridor.yaml` and pick the state.
      options:
        - "NOT RUNNABLE — a required endpoint is missing outright"
        - "UNVERIFIED — endpoints present but not confirmed against stellar.toml"
        - "VERIFIED — endpoints checked against anchor's published stellar.toml on a recorded date"
    validations:
      required: true
  - type: input
    id: verified_at
    attributes:
      label: Date you fetched stellar.toml
      description: If VERIFIED, the date you confirmed endpoints against https://<home_domain>/.well-known/stellar.toml (YYYY-MM-DD).
      placeholder: "2026-01-15"
    validations:
      required: false
  - type: textarea
    id: probe_output
    attributes:
      label: Probe output (if run)
      description: Paste the output of `@corridor/probe` if you ran it against the anchor's stellar.toml.
      render: text
    validations:
      required: false
  - type: textarea
    id: endpoints
    attributes:
      label: Known stellar.toml endpoint keys
      description: |
        List the keys from the anchor's published stellar.toml. The probe reads:
        - `DIRECT_PAYMENT_SERVER` (SEP-31)
        - `ANCHOR_QUOTE_SERVER` (SEP-38)
        - `WEB_AUTH_ENDPOINT` (SEP-10)
        - `KYC_SERVER` (SEP-12)
        - `TRANSFER_SERVER` (SEP-6)
        - `TRANSFER_SERVER_SEP0024` (SEP-24)

        Note: Most real ramps are SEP-24/SEP-6, not SEP-31. Say which SEPs the anchor actually publishes.
      render: yaml
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Who holds FX risk, settlement asset, jurisdictions, anything else relevant.
    validations:
      required: false
